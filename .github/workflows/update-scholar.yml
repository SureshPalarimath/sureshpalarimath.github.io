name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (06:17 in Oman)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch metrics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/metrics.json
          git diff --cached --quiet || (git commit -m "Update Google Scholar metrics" && git push)
